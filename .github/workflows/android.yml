# Builds the android app whenever its code changes, so a broken change shows up here and not on someones phone.
# With the KINO_KEYSTORE_B64 and KINO_KEYSTORE_PASSWORD secrets set it signs with the real kino key,
# the signed apk is then attached to the run so it can be copied to app/static/kino.apk
name: Android app

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build
        working-directory: android
        env:
          KS_B64: ${{ secrets.KINO_KEYSTORE_B64 }}
          KINO_KEYSTORE_PASSWORD: ${{ secrets.KINO_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/kino.keystore"
            export KINO_KEYSTORE="$RUNNER_TEMP/kino.keystore"
          fi
          ./gradlew assembleRelease --no-daemon -q
      - uses: actions/upload-artifact@v4
        with:
          name: kino-android
          path: android/app/build/outputs/apk/release/app-release.apk
