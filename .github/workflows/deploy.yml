name: Deploy kino

on:
  push:
    branches: [main]
  pull_request:
  # Lets you rerun the deploy from the Actions tab
  workflow_dispatch:

concurrency:
  group: deploy-kino
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches typos before they ever reach the vps, a broken push just stops here
      - name: Syntax checks
        run: |
          python3 -m py_compile app/app.py sync/sync.py
          node --check app/static/app.js
          bash -n install.sh
          bash -n deploy/update.sh

      - name: App starts and answers
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q -r app/requirements.txt
          mkdir -p /tmp/media /tmp/data
          cd app
          MEDIA_DIR=/tmp/media DATA_DIR=/tmp/data KINO_SECRET=ci OFFLINE_META=1 COOKIE_SECURE=0 \
            /tmp/venv/bin/uvicorn app:app --port 8282 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8282/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:8282/healthz
          curl -fs http://127.0.0.1:8282/ | grep -q "<title>Kino</title>"
          H='X-Kino: 1'
          # No profile picked yet has to send you to the profile screen
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8282/api/library)" = 409
          # Admin pages need the admin login
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8282/api/admin/sync)" = 401
          # Changes without the header get refused
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8282/api/profiles/1/select)" = 403
          # Picking a profile works and then the home page loads
          curl -fs -c /tmp/cj -H "$H" -X POST http://127.0.0.1:8282/api/profiles/1/select > /dev/null
          curl -fs -b /tmp/cj http://127.0.0.1:8282/api/home | grep -q '"shelves"'
          # Addons are admin only, and the addon search answers even with none installed
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/cj http://127.0.0.1:8282/api/admin/addons)" = 401
          curl -fs -b /tmp/cj "http://127.0.0.1:8282/api/search/addons?q=test" | grep -q '"external"'
          curl -fs -b /tmp/cj "http://127.0.0.1:8282/api/streams/movie/tt0013442" | grep -q '"streams":\[\]'
          # My List add and remove
          curl -fs -b /tmp/cj -H "$H" -H 'Content-Type: application/json' -X POST http://127.0.0.1:8282/api/mylist -d '{"kind":"movie","id":"tt0013442"}' | grep -q '"ok":true'
          curl -fs -b /tmp/cj -H "$H" -X DELETE "http://127.0.0.1:8282/api/mylist?key=tt0013442" | grep -q '"ok":true'
          # The device gate answers, and says no for an unknown device on a blocked address
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Real-IP: 203.0.113.9' http://127.0.0.1:8282/api/gate)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8282/api/gate)" = 204
          curl -fs -H 'X-Real-IP: 203.0.113.9' http://127.0.0.1:8282/gate | grep -q "Ask for Access"
          curl -fs -b /tmp/cj http://127.0.0.1:8282/api/search/start | grep -q '"explore"'
          # A request from an address thats not on the allow list gets blocked
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Real-IP: 203.0.113.9' -b /tmp/cj http://127.0.0.1:8282/api/home)" = 403

      - name: Sync helper scripts
        run: |
          python3 -m py_compile deploy/kino-watchdog.py deploy/kino-allowlist.py

  deploy:
    needs: check
    # Pull requests only get checked, only main goes live
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.KINO_DEPLOY_KEY }}
          # The key is locked to kino-update on the server so this is the only thing it can run anyway
          script: kino-update
          command_timeout: 20m
