// The kino android app, a small native shell around kino.reece.page for phones, tablets and android tv / fire tv
plugins { id "com.android.application" }

android {
    namespace "page.reece.kino"
    compileSdk 35

    defaultConfig {
        applicationId "page.reece.kino"
        minSdk 24
        targetSdk 35
        versionCode 27
        versionName "3.6"
        // The address the app opens, change it here if kino ever moves
        buildConfigField "String", "KINO_URL", "\"https://kino.reece.page/\""
    }

    buildFeatures { buildConfig true }

    // Release builds get signed with the kino key when its there (CI passes it in), otherwise the debug key
    signingConfigs {
        kino {
            def ks = System.getenv("KINO_KEYSTORE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("KINO_KEYSTORE_PASSWORD")
                keyAlias System.getenv("KINO_KEY_ALIAS") ?: "kino"
                keyPassword System.getenv("KINO_KEY_PASSWORD") ?: System.getenv("KINO_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (!System.getenv("KINO_KEYSTORE") && !System.getenv("CI") && !project.hasProperty("allowDebugSigned")
                    && gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }) {
                // A debug signed apk cant update any installed Kino, android refuses it, so a release build never falls back by accident
                throw new GradleException("No KINO_KEYSTORE set, a release build needs the real Kino key (pass -PallowDebugSigned for a throwaway test build)")
            }
            signingConfig System.getenv("KINO_KEYSTORE") ? signingConfigs.kino : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // exoplayer, the same player stremio uses, so videos go straight to the tv's hardware decoder
    def media3 = "1.4.1"
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-ui:$media3"
}
