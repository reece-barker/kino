<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kino">
<title>Kino</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="icon" href="/static/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="stylesheet" href="/static/app.css?v=__V__">
<link rel="stylesheet" href="/static/sizing.css?v=__V__">
</head>
<body>
<div id="app"></div>
<div id="routeSay" class="sr" role="status"></div>
<div id="player" class="player" hidden>
  <video id="video" playsinline preload="auto" x-webkit-airplay="allow"></video>
  <div class="subs-layer" id="subsLayer" aria-live="off"></div>
  <div class="player-spinner" id="playerSpinner" hidden><div class="spin"></div></div>
  <div class="player-load" id="pLoad" hidden>
    <div class="pl-bg" id="plBg"></div>
    <div class="pl-mid"><div class="pl-logo" id="plLogo"></div><div class="pl-bar"><i></i></div><div class="pl-stats" id="plStats" aria-live="polite"></div></div>
  </div>
  <div class="still glass" id="pStill" role="alertdialog" aria-labelledby="stillQ" hidden>
    <h3 id="stillQ">Are you still watching?</h3><p class="secondary" id="stillWhat"></p>
    <div class="actions"><button class="btn primary small" id="stillYes">Continue Watching</button><button class="btn secondary small" id="stillNo">Stop</button></div>
  </div>
  <button class="skip-intro" id="skipIntro" hidden>Skip Intro</button>
  <div class="up-next glass" id="upNext" role="status" hidden></div>
  <div class="player-ui" id="playerUi">
    <div class="player-top">
      <button class="glass-btn round" id="pClose" aria-label="Close player"></button>
      <img class="player-logo" id="pLogo" alt="" hidden>
      <div class="player-title"><div id="pTitle"></div><div id="pSub" class="secondary"></div></div>
      <span class="live-chip" id="pLive">Live</span>
    </div>
    <div class="player-msg" id="pMsg" hidden></div>
    <div class="player-bottom">
      <div class="tl-row">
        <span class="time" id="tNow">0:00</span>
        <div class="scrub" id="scrub" role="slider" tabindex="0" aria-label="Playback position" aria-valuemin="0">
          <div class="scrub-track"><div class="scrub-buf" id="scrubBuf"></div><div class="scrub-fill" id="scrubFill"></div></div>
          <div class="scrub-knob" id="scrubKnob"></div>
          <div class="scrub-tip" id="scrubTip" hidden></div>
        </div>
        <span class="time right" id="tLeft">-0:00</span>
      </div>
      <div class="player-row">
        <div class="ctl ctl-l">
          <button class="icon-btn" id="pMute" aria-label="Mute" title="Mute"></button>
          <input type="range" id="pVol" min="0" max="1" step="0.05" value="1" aria-label="Volume">
        </div>
        <div class="ctl ctl-c">
          <button class="icon-btn" id="pBack" aria-label="Back 10 seconds" title="Back 10 Seconds"></button>
          <button class="icon-btn big" id="pPlay" aria-label="Play"></button>
          <button class="icon-btn" id="pFwd" aria-label="Forward 10 seconds" title="Forward 10 Seconds"></button>
        </div>
        <div class="ctl ctl-r">
          <div class="menu-wrap"><button class="icon-btn" id="pAdminIntro" aria-haspopup="true" aria-label="Mark Intro" title="Mark Intro" hidden></button><div class="menu" id="mIntro" hidden></div></div>
          <div class="menu-wrap"><button class="icon-btn" id="pSubs" aria-haspopup="true" aria-label="Subtitles" title="Subtitles"></button><div class="menu" id="mSubs" hidden></div></div>
          <div class="menu-wrap"><button class="icon-btn" id="pAudio" aria-haspopup="true" aria-label="Audio" title="Audio"></button><div class="menu" id="mAudio" hidden></div></div>
          <div class="menu-wrap"><button class="icon-btn" id="pSpeed" aria-haspopup="true" aria-label="Playback Speed" title="Playback Speed"></button><div class="menu" id="mSpeed" hidden></div></div>
          <button class="icon-btn" id="pAir" aria-label="AirPlay" title="AirPlay" hidden></button>
          <button class="icon-btn" id="pPip" aria-label="Picture in Picture" title="Picture in Picture" hidden></button>
          <button class="icon-btn" id="pFull" aria-label="Full Screen" title="Full Screen"></button>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="toast" class="toast glass" role="status" hidden></div>
<script src="/static/app.js?v=__V__"></script>
</body>
</html>
