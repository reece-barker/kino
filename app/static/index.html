<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<title>Kino</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="app" aria-live="polite"></div>
<div id="player" class="player" hidden>
  <video id="video" playsinline preload="auto"></video>
  <div class="subs-layer" id="subsLayer" aria-live="off"></div>
  <div class="player-spinner" id="playerSpinner" hidden><div class="spin"></div></div>
  <div class="player-ui" id="playerUi">
    <div class="player-top">
      <button class="glass-btn round" id="pClose" aria-label="Close player"></button>
      <div class="player-title"><div id="pTitle"></div><div id="pSub" class="secondary"></div></div>
    </div>
    <div class="player-msg" id="pMsg" hidden></div>
    <div class="player-bottom glass">
      <div class="scrub" id="scrub" role="slider" tabindex="0" aria-label="Playback position" aria-valuemin="0">
        <div class="scrub-track"><div class="scrub-buf" id="scrubBuf"></div><div class="scrub-fill" id="scrubFill"></div></div>
        <div class="scrub-knob" id="scrubKnob"></div>
        <div class="scrub-tip" id="scrubTip" hidden></div>
      </div>
      <div class="player-row">
        <span class="time" id="tNow">0:00</span>
        <div class="player-center">
          <button class="icon-btn" id="pBack" aria-label="Back 10 seconds"></button>
          <button class="icon-btn big" id="pPlay" aria-label="Play"></button>
          <button class="icon-btn" id="pFwd" aria-label="Forward 10 seconds"></button>
        </div>
        <span class="time right" id="tLeft">-0:00</span>
      </div>
      <div class="player-row tools">
        <div class="menu-wrap"><button class="pill-btn" id="pAudio" aria-haspopup="true"></button><div class="menu" id="mAudio" hidden></div></div>
        <div class="menu-wrap"><button class="pill-btn" id="pSubs" aria-haspopup="true"></button><div class="menu" id="mSubs" hidden></div></div>
        <span class="spacer"></span>
        <button class="icon-btn" id="pMute" aria-label="Mute"></button>
        <input type="range" id="pVol" min="0" max="1" step="0.05" value="1" aria-label="Volume">
        <button class="icon-btn" id="pFull" aria-label="Full screen"></button>
      </div>
    </div>
  </div>
</div>
<div id="toast" class="toast glass" role="status" hidden></div>
<script src="/static/hls.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
