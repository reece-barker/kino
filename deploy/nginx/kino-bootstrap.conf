# Temporary config so certbot can get the certificate, the installer swaps it for kino.conf after
server {
    listen 80;
    listen [::]:80;
    server_name kino.reece.page;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }
    location / {
        return 404;
    }
}
