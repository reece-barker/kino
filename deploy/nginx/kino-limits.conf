# Rate limit zones for kino, these have to live in the http block so they go in conf.d
# The whole family shares one home ip so the general limits are roomy, only the login one is strict
limit_req_zone $binary_remote_addr zone=kino_req:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=kino_login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=kino_conn:10m;
