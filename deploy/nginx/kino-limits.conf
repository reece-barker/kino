# Rate limit zones for kino, these have to live in the http block so they go in conf.d
# The whole family shares one home ip so the general limits are roomy, only the login one is strict
limit_req_zone $binary_remote_addr zone=kino_req:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=kino_login:10m rate=10r/m;
# The app download has its own counter: the whole family shares one public address, and it used to share the sign in counter, so a few sign in
# tries made a tv's update fail with 429
limit_req_zone $binary_remote_addr zone=kino_app:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=kino_share:10m rate=30r/m;  # open share links (Kino Wrapped), a page and its pictures are about 7 requests
limit_conn_zone $binary_remote_addr zone=kino_conn:10m;
