# One shared connection to the app instead of a new one for every request. The 4s is shorter than uvicorns own
# 5s keepalive so nginx never reuses a connection the app is just closing
upstream kino {
    server 127.0.0.1:8282;
    keepalive 16;
    keepalive_timeout 4s;
}

server {
    listen 80;
    listen [::]:80;
    server_name kino.reece.page;

    # Certbot renewals use this folder, everything else goes to https
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # The http2 flag on listen works on the 1.24 from ubuntu 24.04. Its only the separate "http2 on;" line that needs 1.25.1,
    # newer nginx just warns that this flag is deprecated, so move to that one when ubuntu gets there
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kino.reece.page;
    access_log /var/log/nginx/kino.access.log;
    error_log /var/log/nginx/kino.error.log warn;

    ssl_certificate /etc/letsencrypt/live/kino.reece.page/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kino.reece.page/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Browser only uses https for this site from now on
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    server_tokens off;
    client_max_body_size 1m;

    # Text only, video and images are already compressed so they are left out
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/json text/css application/javascript text/javascript image/svg+xml application/manifest+json application/vnd.apple.mpegurl;

    # Two ways in: an address on the ip list (kino-allow.conf), or a device the admin approved in Settings.
    # satisfy any means either one is enough, the device check is the /_kino_gate subrequest to the app
    satisfy any;
    include /etc/nginx/snippets/kino-allow.conf;
    auth_request /_kino_gate;
    error_page 401 403 = @kino_blocked;

    # Everyone at home shares one ip so this has to be roomy, logins have there own tight limit below
    limit_conn kino_conn 100;
    limit_req_status 429;   # 429 so its clear in the logs that it was the limiter
    limit_conn_status 429;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /_kino_gate {
        internal;
        proxy_pass http://kino/api/gate;
        proxy_pass_request_body off;
        # Setting any header here drops the ones from the server block, so the real ip has to be passed again.
        # Without it the app would see 127.0.0.1 and let everyone in
        proxy_set_header Content-Length "";
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        # So links made for outside players like vlc (signed, no cookie) can be checked too
        proxy_set_header X-Original-URI $request_uri;
    }

    # Where blocked devices end up, they can see there code and ask for access. Pages only, no api
    location @kino_blocked {
        if ($request_uri ~ ^/api/) { return 403; }
        return 302 /gate;
    }
    location ~ ^/(gate|api/gate/(status|request))$ {
        satisfy any;
        allow all;
        limit_req zone=kino_login burst=10 nodelay;
        proxy_pass http://kino;
    }
    # The blocked page needs the stylesheet and icons, theres nothing private in these
    # An add_header inside a location drops the ones from the server block, so the two are repeated here and in /static/ below
    location ~ ^/(static/(app\.css|gate\.js|icon[^/]*)|favicon\.ico)$ {
        satisfy any;
        allow all;
        limit_req zone=kino_req burst=100 nodelay;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_hide_header Cache-Control;  # The app sends its own no-cache for /static/, only one of them should reach the browser
        add_header Cache-Control "public, max-age=3600";
        proxy_pass http://kino;
    }

    # Login gets a much tighter limit so password guessing is pointless
    location = /api/admin/login {
        limit_req zone=kino_login burst=5 nodelay;
        proxy_pass http://kino;
    }

    # Video and player files, no buffering so seeking and long movies work. Also the remote streams (rstream), the live tv
    # proxy (lp), live channel playlists and live recordings
    location ~ ^/api/((stream|dl|hls|x|rstream|lp)/|live/([^/]+/index\.m3u8|recordings/[0-9]+/file)$) {
        limit_req zone=kino_req burst=400 nodelay;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://kino;
    }

    # The apk and its version file have to stay fresh, they are checked on every app start
    location ~ ^/static/kino(\.apk|-version\.json)$ {
        limit_req zone=kino_req burst=100 nodelay;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_hide_header Cache-Control;  # The app sends its own no-cache for /static/, only one of them should reach the browser
        add_header Cache-Control "no-cache";
        proxy_pass http://kino;
    }

    # The rest of the static files, app.js and app.css have ?v= in there links so a new version gets fetched anyway.
    # An hour only because hls.min.js has no version in its link
    location /static/ {
        limit_req zone=kino_req burst=100 nodelay;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_hide_header Cache-Control;  # The app sends its own no-cache for /static/, only one of them should reach the browser
        add_header Cache-Control "public, max-age=3600";
        proxy_pass http://kino;
    }

    location / {
        limit_req zone=kino_req burst=300 nodelay;
        proxy_read_timeout 120s;
        proxy_pass http://kino;
    }
}
