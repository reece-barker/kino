server {
    listen 80;
    listen [::]:80;
    server_name kino.reece.page;

    # Certbot renewals use this folder, everything else goes to https
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # No http2 line on purpose, ubuntu 24.04 nginx is too old for the new syntax and its not needed here
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kino.reece.page;
    access_log /var/log/nginx/kino.access.log;
    error_log /var/log/nginx/kino.error.log warn;

    ssl_certificate /etc/letsencrypt/live/kino.reece.page/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kino.reece.page/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Browser only uses https for this site from now on
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    server_tokens off;
    client_max_body_size 1m;

    # Same ip lock as stremio, bots found that one in like 10 mins
    include /etc/nginx/snippets/kino-allow.conf;

    limit_conn kino_conn 30;
    limit_req_status 429;   # 429 so its clear in the logs that it was the limiter
    limit_conn_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Login gets a much tighter limit so password guessing is pointless
    location = /api/login {
        limit_req zone=kino_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8282;
    }

    # Video and player files, no buffering so seeking and long movies work
    location ~ ^/api/(stream|dl|hls)/ {
        limit_req zone=kino_req burst=200 nodelay;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://127.0.0.1:8282;
    }

    location / {
        limit_req zone=kino_req burst=120 nodelay;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8282;
    }
}
